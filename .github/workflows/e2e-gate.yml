# E2E Production Gate
#
# Runs the full Playwright test suite against the live production deployment
# (https://vibe-coding-starter-black.vercel.app) on every PR targeting main
# and on manual dispatch.
#
# OPTIONAL SECRETS — the gate works without any secrets; the seeded test
# accounts are hardcoded as defaults in e2e/fixtures/accounts.ts:
#   E2E_TEST_PASSWORD      — default: TestPlyaz123!
#   E2E_ORGANIZER_EMAIL    — default: organizer.test@plyaz.test
#   E2E_PLAYER_EMAIL       — default: player.test@plyaz.test
#   E2E_REFEREE_EMAIL      — default: referee.test@plyaz.test
#
# Add these as GitHub Actions secrets only if the seed credentials change.

name: E2E Prod Gate

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  e2e:
    name: Playwright E2E (prod)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E suite against production
        run: npm run test:e2e:prod
        env:
          E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
          E2E_ORGANIZER_EMAIL: ${{ secrets.E2E_ORGANIZER_EMAIL }}
          E2E_PLAYER_EMAIL: ${{ secrets.E2E_PLAYER_EMAIL }}
          E2E_REFEREE_EMAIL: ${{ secrets.E2E_REFEREE_EMAIL }}

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
